apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: classroom-observer
rules:
  - apiGroups: [""]
    resources: [pods, pods/log, services, endpoints, events, persistentvolumeclaims, configmaps]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, replicasets, statefulsets]
    verbs: [get, list, watch]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch]
  - apiGroups: [events.k8s.io]
    resources: [events]
    verbs: [get, list, watch]
# ClusterRole is a reusable rule, not a cluster-wide grant.
# Only namespace RoleBindings grant access. No Secrets/exec/portforward/write/node privileges.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: classroom-namespace-discovery
rules:
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get, list, watch]
