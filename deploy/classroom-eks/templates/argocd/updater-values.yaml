replicaCount: 1
createClusterRoles: false
serviceAccount:
  create: true
  name: argocd-image-updater
extraArgs: [--interval, 1m]
config:
  git.user: classroom-image-updater
  git.email: classroom-image-updater@users.noreply.github.com
  registries:
    - name: classroom-ecr
      api_url: https://__REGISTRY__
      prefix: __REGISTRY__
      credentials: ext:/scripts/ecr-login.sh
      credsexpire: 10h
authScripts:
  enabled: true
  scripts:
    ecr-login.sh: |
      #!/bin/sh
      set -eu
      TOKEN=$(aws ecr get-authorization-token --region __REGION__ --query authorizationData[0].authorizationToken --output text)
      printf %s "$TOKEN" | base64 -d
