apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: classroom-team
  namespace: argocd
# No cascading deletion finalizer on the database teaching application.
spec:
  project: classroom
  source:
    repoURL: __GIT_REPOSITORY__
    targetRevision: __GIT_BRANCH__
    path: __GIT_PATH__
  destination:
    server: https://kubernetes.default.svc
    namespace: team
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 1m
