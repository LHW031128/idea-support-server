apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: classroom
  namespace: argocd
spec:
  sourceRepos:
    - git@github.com:MinQDU014/idea-support-server.git
  destinations:
    - namespace: team
      server: https://kubernetes.default.svc
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - group: ""
      kind: Service
    - group: ""
      kind: PersistentVolumeClaim
    - group: apps
      kind: Deployment
    - group: apps
      kind: StatefulSet
